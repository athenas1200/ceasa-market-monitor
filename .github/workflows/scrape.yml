name: Scrape CEASA diario

on:
  schedule:
    - cron: '20 8 * * *'   # 08:20 UTC = 05:20 BRT, diario
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 pandas

      - name: Raspar cotações CEASA (Agrolink)
        run: python scraper_ceasa_completo.py --delay 0.9

      - name: Commit dos dados atualizados
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ceasa_dashboard.json ceasa_todos.csv
          git diff --cached --quiet || git commit -m "update dados CEASA $(date +%Y-%m-%d)"
          git push
